imports:
  http: ../common/http.yml
  method: ../common/method.yml
  waf: ../common/waf.yml
types:
  DiscoverProbeWebServer:
    properties:
      ipAddress: string
      port: integer
      applicationProtocol: http.WebProtocol
  # Config Struct
  DiscoverProbeConfig:
    properties:
      targets: list<string>
      protocol: optional<http.WebProtocol>
      maxRedirects: integer
      verifyTls: boolean
      timeout: integer
      retries: integer
      sleep: integer
      jitter: integer
      ignoreCrossDomainRedirects: boolean
      userAgent: method.UserAgentPreset
      requestMethod: method.RequestMethod
      headlessConfig: optional<method.HeadlessRequestConfig>
      browserbaseConfig: optional<method.BrowserbaseRequestConfig>
      webServers: optional<list<DiscoverProbeWebServer>>
  DiscoverProbeTargetInfo:
    properties:
      target: string
      attempts: list<http.HttpRequestResponse>
      wafDetection: optional<waf.WafDetection>
  DiscoverProbeResult:
    properties:
      targets: optional<list<DiscoverProbeTargetInfo>>
  # Report Struct
  DiscoverProbeReport:
    properties:
      config: DiscoverProbeConfig
      result: DiscoverProbeResult
      errors: optional<list<string>>
