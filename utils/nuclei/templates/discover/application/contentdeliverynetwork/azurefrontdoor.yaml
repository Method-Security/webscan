id: azure-front-door-detect
info:
  name: Azure Front Door Detection
  author: method-security
  severity: info
  description: Detects Azure Front Door only when the response includes a valid Front Door reference string.
  metadata:
    method-application-type: CONTENT_DELIVERY_NETWORK
    method-module-name: AZURE_FRONTDOOR
  tags: discovery,azure,front-door,cdn
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)x-azure-ref:\\s*(?:[A-Za-z0-9+/=]{20,}|[0-9]{8}T[0-9]{6}Z-[A-Za-z0-9-]{20,})"
