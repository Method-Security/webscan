id: cloudflare-cdn-detect
info:
  name: Cloudflare CDN Detection
  author: method-security
  severity: info
  description: Detects Cloudflare CDN only when the response includes both a Cloudflare Ray ID and Cloudflare server banner.
  metadata:
    method-application-type: CONTENT_DELIVERY_NETWORK
    method-module-name: CLOUDFLARE
  tags: discovery,cloudflare,cdn
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'regex("(?im)^cf-ray:\\s*[A-Fa-f0-9]+-[A-Z]{3}", header) && regex("(?im)^server:\\s*cloudflare\\s*$", header)'
